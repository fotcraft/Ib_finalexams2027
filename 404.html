<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IB May 2027 Exam Planner</title>
<style>
  :root{--bg:#fff;--ink:#111;--muted:#666;--line:#e3e3e3}
  @media (prefers-color-scheme:dark){:root{--bg:#111;--ink:#f2f2f2;--muted:#9a9a9a;--line:#2c2c2c}}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  main{max-width:32rem;margin:0 auto;padding:48px 16px}
  p{color:var(--muted)}
  a.btn{display:inline-flex;align-items:center;height:42px;padding:0 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;text-decoration:none}
</style>
</head>
<body>
<main>
  <h1 id="h">Page not found</h1>
  <p id="msg">This page doesn't exist.</p>
  <p><a class="btn" id="back" href="./">Back to the planner</a></p>
</main>
<script>
(function(){
  // GitHub Pages shows this page for missing files. all.ics is built by sw.js, so landing here means
  // the helper wasn't running yet. Start it and try once more; if that fails, point back to the per-subject buttons.
  var isAll = /\/all\.ics$/.test(location.pathname);
  var back = document.getElementById("back");
  back.href = location.pathname.split("/").slice(0, 2).join("/") + "/";
  if (!isAll) return;
  document.getElementById("h").textContent = "Add all didn't work here";
  document.getElementById("msg").textContent = "Go back to the planner and add each subject on its own with the subject buttons.";
  var tried = false;
  try { tried = sessionStorage.getItem("allics-retry") === location.search; sessionStorage.setItem("allics-retry", location.search); } catch(e) { tried = true; }
  if (tried || !("serviceWorker" in navigator)) return;
  document.getElementById("h").textContent = "One moment...";
  document.getElementById("msg").textContent = "Building your calendar file.";
  var done = false;
  function fail(){
    if (done) return; done = true;
    document.getElementById("h").textContent = "Add all didn't work here";
    document.getElementById("msg").textContent = "Go back to the planner and add each subject on its own with the subject buttons.";
  }
  setTimeout(fail, 5000);
  navigator.serviceWorker.register("sw.js").then(function(){ return navigator.serviceWorker.ready; })
    .then(function(){ if (!done) { done = true; location.reload(); } }, fail);
})();
</script>
</body>
</html>
